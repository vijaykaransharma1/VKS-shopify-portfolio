    // TYPEWRITER HOOK
    // =============================================
    function useTypewriter(texts, speed = 70, pause = 2000) {
      const [displayText, setDisplayText] = useState('');
      const [isDeleting, setIsDeleting] = useState(false);
      const [textIndex, setTextIndex] = useState(0);
      const [charIndex, setCharIndex] = useState(0);

      useEffect(() => {
        const currentText = texts[textIndex];
        let timer;
        if (!isDeleting && charIndex < currentText.length) {
          timer = setTimeout(() => setCharIndex(c => c + 1), speed);
        } else if (!isDeleting && charIndex === currentText.length) {
          timer = setTimeout(() => setIsDeleting(true), pause);
        } else if (isDeleting && charIndex > 0) {
          timer = setTimeout(() => setCharIndex(c => c - 1), speed / 2);
        } else if (isDeleting && charIndex === 0) {
          setIsDeleting(false);
          setTextIndex(i => (i + 1) % texts.length);
        }
        setDisplayText(currentText.slice(0, charIndex));
        return () => clearTimeout(timer);
      }, [charIndex, isDeleting, textIndex, texts, speed, pause]);

      return displayText;
    }

    // =============================================
    // SCROLL REVEAL HOOK
    // =============================================
    function useScrollReveal() {
      useEffect(() => {
        const SELECTOR = '.reveal, .reveal-left, .reveal-right, .reveal-scale, .reveal-up';
        const io = new IntersectionObserver(
          (entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                io.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.08, rootMargin: '0px 0px -30px 0px' }
        );
        const observeAll = () => {
          document.querySelectorAll(SELECTOR).forEach(el => {
            const rect = el.getBoundingClientRect();
            if (rect.top < window.innerHeight && rect.bottom > 0) {
              el.classList.add('visible');
            } else {
              io.observe(el);
            }
          });
        };
        observeAll();
        const mo = new MutationObserver(() => observeAll());
        mo.observe(document.body, { childList: true, subtree: true });
        return () => { io.disconnect(); mo.disconnect(); };
      }, []);
    }

    // =============================================
    // COUNTER HOOK
    // =============================================
    function useCountUp(target, duration = 1600) {
      const [count, setCount] = useState(0);
      const ref = useRef(null);
      useEffect(() => {
        const observer = new IntersectionObserver((entries) => {
          if (entries[0].isIntersecting) {
            const numTarget = parseInt(target.replace(/\D/g, '')) || 0;
            const start = Date.now();
            const tick = () => {
              const elapsed = Date.now() - start;
              const progress = Math.min(elapsed / duration, 1);
              const eased = 1 - Math.pow(1 - progress, 3);
              setCount(Math.round(eased * numTarget));
              if (progress < 1) requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
            observer.disconnect();
          }
        }, { threshold: 0.5 });
        if (ref.current) observer.observe(ref.current);
        return () => observer.disconnect();
      }, [target, duration]);
      return { count, ref };
    }

          <div className="sbi-lbl">{stat.label}</div>
        </div>
      );
    }

                <div className="contact-form-wrap reveal-right">
                  <h3>Send a Direct Message</h3>
                  <p className="form-sub">I usually respond within 24 hours.</p>

                  {submitSuccess ? (
                    <div className="form-success-alert">
                      <i className="fa-regular fa-circle-check"></i>
                      <h3>Message Received!</h3>
                      <p>Thank you for reaching out. I'll review your project details and get back to you shortly.</p>
                      <button onClick={() => setSubmitSuccess(false)} className="btn-primary" style={{ marginTop: '1.5rem' }}>
                        Send Another Inquiry
                      </button>
                    </div>
                  ) : (
                    <form id="contact-form" onSubmit={handleFormSubmit}>
                      {formError && (
                        <div className="form-err">
                          <i className="fa-solid fa-circle-exclamation"></i> {formError}
                        </div>
                      )}

                      <div className="form-row">
                        <div className="form-group">
                          <label className="form-label" htmlFor="contact-name">Your Name</label>
                          <input
                            id="contact-name"
                            type="text"
                            className="form-control"
                            placeholder="e.g. Sarah Jenkins"
                            value={formState.name}
                            onChange={e => setFormState({ ...formState, name: e.target.value })}
                          />
                        </div>
                        <div className="form-group">
                          <label className="form-label" htmlFor="contact-email">Email Address</label>
                          <input
                            id="contact-email"
                            type="email"
                            className="form-control"
                            placeholder="e.g. sarah@brand.com"
                            value={formState.email}
                            onChange={e => setFormState({ ...formState, email: e.target.value })}
                          />
                        </div>
                      </div>

                      <div className="form-group">
                        <label className="form-label" htmlFor="contact-subject">Project Type / Store Domain</label>
                        <input
                          id="contact-subject"
                          type="text"
                          className="form-control"
                          placeholder="e.g. Custom Theme Build / Speed Optimization"
                          value={formState.subject}
                          onChange={e => setFormState({ ...formState, subject: e.target.value })}
                        />
                      </div>

                      <div className="form-group">
                        <label className="form-label" htmlFor="contact-message">Project Details</label>
                        <textarea
                          id="contact-message"
                          className="form-control"
                          placeholder="Tell me about your store requirements, timeline, and goals..."
                          value={formState.message}
                          onChange={e => setFormState({ ...formState, message: e.target.value })}
                        ></textarea>
                      </div>

                      <button id="contact-submit-btn" type="submit" disabled={isSubmitting} className="form-submit">
                        {isSubmitting ? (
                          <><i className="fa-solid fa-spinner fa-spin"></i> Sending Inquiry...</>
                        ) : (
                          <>Send Message <i className="fa-solid fa-paper-plane"></i></>
                        )}
                      </button>
                    </form>
                  )}
                </div>

              </div>
            </div>
          </section>

          {/* ==================== FOOTER ==================== */}
          <footer className="footer">
            <div className="container">
              <div className="footer-inner">
                <div className="footer-brand">
                  <div className="footer-logo">
                    <div className="logo-icon"><i className="fa-brands fa-shopify"></i></div>
                    VIJAY KARAN SHARMA
                  </div>
                  <p>
                    Shopify Developer & E-Commerce Architect specializing in bespoke Liquid themes, high-performance storefronts, and conversion-focused integrations.
                  </p>
                </div>

                <div className="footer-col">
                  <h4>Quick Links</h4>
                  <ul>
                    {navLinks.map(link => (
                      <li key={link.id}>
                        <a href={`#${link.id}`} onClick={e => { e.preventDefault(); handleNavClick(link.id); }}>{link.label}</a>
                      </li>
                    ))}
                  </ul>
                </div>

                <div className="footer-col">
                  <h4>Services</h4>
                  <ul>
                    {['Shopify Liquid Themes', 'Figma to Shopify', 'App Replacements', 'Speed Optimization', 'React Web Apps'].map(s => (
                      <li key={s}><a href="#contact" onClick={e => { e.preventDefault(); handleNavClick('contact'); }}>{s}</a></li>
                    ))}
                  </ul>
                </div>
              </div>

              <div className="footer-bottom">
                <div className="footer-socials" style={{ marginLeft: 'auto' }}>
                  <a href={`mailto:${DATA.profile.email}`} className="footer-social-btn" title="Email"><i className="fa-solid fa-envelope"></i></a>
                  <a href={`https://wa.me/919459009099`} target="_blank" rel="noopener noreferrer" className="footer-social-btn" title="WhatsApp"><i className="fa-brands fa-whatsapp"></i></a>
                  <a href={DATA.profile.linkedin} target="_blank" rel="noopener noreferrer" className="footer-social-btn" title="LinkedIn"><i className="fa-brands fa-linkedin"></i></a>
                  <a href="#home" onClick={e => { e.preventDefault(); handleNavClick('home'); }} className="footer-social-btn" title="Back to Top"><i className="fa-solid fa-chevron-up"></i></a>
                </div>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- ================================================
       SUBTLE MONOCHROME UTILITY ANIMATIONS
       Scroll Progress & Subtle Pointer Interaction
       ================================================ -->
  <script>
    (function() {
      function ready(fn) {
        if (document.readyState !== 'loading') fn();
        else document.addEventListener('DOMContentLoaded', fn);
      }

      ready(function() {
        /* 1. SCROLL PROGRESS BAR (BLACK) */
        const progressBar = document.createElement('div');
        progressBar.className = 'scroll-progress';
        document.body.prepend(progressBar);
        window.addEventListener('scroll', function() {
          const scrollTop = window.scrollY;
          const docHeight = document.documentElement.scrollHeight - window.innerHeight;
          const progress = docHeight > 0 ? scrollTop / docHeight : 0;
          progressBar.style.transform = `scaleX(${progress})`;
        }, { passive: true });

        /* 2. SUBTLE MONOCHROME SPOTLIGHT */
        const spotlight = document.createElement('div');
        spotlight.className = 'cursor-spotlight';
        document.body.appendChild(spotlight);
        let mouseX = -999, mouseY = -999, spotX = -999, spotY = -999;
        window.addEventListener('mousemove', function(e) {
          mouseX = e.clientX;
          mouseY = e.clientY;
        }, { passive: true });
        function lerpSpotlight() {
          spotX += (mouseX - spotX) * 0.08;
          spotY += (mouseY - spotY) * 0.08;
          spotlight.style.left = spotX + 'px';
          spotlight.style.top = spotY + 'px';
          requestAnimationFrame(lerpSpotlight);
        }
        lerpSpotlight();
        document.body.addEventListener('mouseleave', function() { spotlight.style.opacity = '0'; });
        document.body.addEventListener('mouseenter', function() { spotlight.style.opacity = '1'; });
      });
    })();
  </script>
</body>
</html>
